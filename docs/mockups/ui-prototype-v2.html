<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasaysayan Hex Storyteller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
/* Layout idea: night-sea map room. Story steps scroll on the left; a hex cartogram of the islands stays pinned on the right and fills in as history advances; a year ruler runs along its foot. */
:root{
  --sea:#0d1f2b;
  --sea-2:#132a39;
  --hex:#213f52;
  --ink:#ede7da;
  --muted:#97a7b3;
  --line:#2a4558;
  --gold:#e3b04b;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Literata", Georgia, serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit}

.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:color-mix(in srgb,var(--sea) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--display);font-weight:800;font-size:22px}
.brand span{font-family:var(--display);font-size:12px;color:var(--muted)}
.top nav{display:flex;gap:4px;font-family:var(--display);font-size:14px}
.top nav a{color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px}
.top nav a[aria-current="page"]{color:var(--ink);background:var(--sea-2)}
.proto{font-family:var(--display);font-size:12px;color:var(--gold);padding:6px 24px;border-bottom:1px solid var(--line)}

.stage{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr)}
.story{padding:0 28px 40vh;border-right:1px solid var(--line)}
.intro{padding:56px 0 40px}
.intro h1{font-size:44px;font-weight:800;line-height:1.05}
.intro p{color:var(--muted);margin:14px 0 0;max-width:36ch}
.intro .hint{font-family:var(--display);font-size:13px;color:var(--gold);margin-top:20px}

.step{min-height:62vh;padding:28px 0;display:flex;flex-direction:column;justify-content:center;opacity:.35;transition:opacity .3s}
.step.on{opacity:1}
.era-tag{font-family:var(--display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--c)}
.step .yr{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--c);font-variant-numeric:tabular-nums;margin:6px 0 4px}
.step .yr.long{font-size:40px}
.step h2{font-size:26px;font-weight:700;line-height:1.15}
.step p{margin:10px 0 0;color:#cfd6db}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-family:var(--display);font-size:12px}
.meta span{border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--muted)}
.meta .contested{border-color:var(--gold);color:var(--gold)}
.open{margin-top:14px;font-family:var(--display);font-size:14px;font-weight:700;text-decoration:none}

.mapside{position:sticky;top:53px;height:calc(100vh - 53px);display:flex;flex-direction:column}
.mapwrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:12px}
.mapwrap svg{max-height:100%;max-width:100%;height:100%;width:auto;display:block}
.hx{fill:var(--hex);stroke:var(--sea);stroke-width:1.5;transition:fill .5s, opacity .5s;cursor:default}
.hx.ev{cursor:pointer}
.hx.past{opacity:.55}
.hx.now{opacity:1}
.ring{fill:none;stroke:var(--gold);stroke-width:2.5}
@media (prefers-reduced-motion:no-preference){ .ring{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center} }
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(2.2);opacity:0}}
.lbl{font-family:var(--display);font-size:13px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:4px}
.nationwide .hx:not(.ev){fill:var(--nc);opacity:.35}
.legend{position:absolute;left:16px;top:16px;font-family:var(--display);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;max-width:190px}
.legend .now-card{background:var(--sea-2);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:8px 10px;color:var(--ink)}
.legend .now-card small{display:block;color:var(--muted)}
.panel{position:absolute;right:16px;top:16px;width:240px;background:var(--sea-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--display);font-size:13px;display:none}
.panel.show{display:block}
.panel h3{font-size:15px;margin-bottom:6px}
.panel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.panel button.x{float:right;background:none;border:0;color:var(--muted);cursor:pointer}

.ruler{border-top:1px solid var(--line);padding:10px 20px 14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--sea-2)}
.play{background:var(--gold);color:var(--sea);border:0;border-radius:999px;font-family:var(--display);font-weight:700;font-size:14px;padding:8px 16px;cursor:pointer;min-width:84px}
.track{position:relative;height:44px}
.track .bands{position:absolute;left:0;right:0;top:8px;height:6px;display:flex;border-radius:3px;overflow:hidden}
.track .bands i{display:block;height:100%}
.track .ticks{position:absolute;left:0;right:0;top:20px;font-family:var(--display);font-size:11px;color:var(--muted)}
.track .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.track input{position:absolute;left:0;right:0;top:0;width:100%;height:22px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--gold)}
.track input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:3px solid var(--gold)}

/* event page */
.event{max-width:720px;margin:0 auto;padding:32px 24px 72px}
.event .back{font-family:var(--display);font-size:14px;text-decoration:none}
.event .yr{font-family:var(--display);font-weight:800;font-size:56px;color:var(--c);line-height:1;margin-top:20px}
.event h1{font-size:clamp(30px,4.5vw,44px);font-weight:800;line-height:1.08;margin:8px 0 6px}
.photo{margin:24px 0 0}
.photo .img{aspect-ratio:16/9;border-radius:6px;background:repeating-linear-gradient(135deg,#3a3326 0 10px,#2f2a20 10px 20px);display:flex;align-items:center;justify-content:center;color:#b9ab8e;font-family:var(--display);font-size:14px}
.photo figcaption{font-family:var(--display);font-size:12px;color:var(--muted);margin-top:6px}
.note{border-left:3px solid var(--gold);background:var(--sea-2);padding:10px 14px;margin:20px 0;font-size:15px}
.event .body{font-size:18px;line-height:1.75;max-width:65ch}
.cols{display:grid;grid-template-columns:1fr 240px;gap:24px;margin-top:28px}
.leaflet{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#d8dfe3}
.leaflet .fake{aspect-ratio:1;position:relative;background:
  linear-gradient(90deg,transparent 49%,#c3ccd1 49% 51%,transparent 51%) 0 0/40px 40px,
  linear-gradient(0deg,transparent 49%,#c3ccd1 49% 51%,transparent 51%) 0 0/40px 40px, #e9ecdf}
.leaflet .fake i{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-18px 0 0 -9px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#c0392b;border:2px solid #fff}
.leaflet small{display:block;font-family:var(--display);font-size:11px;color:#333;padding:5px 8px;background:#fff}
.sources h2{font-size:20px;margin:32px 0 8px}
.sources ol{padding-left:20px;margin:0;font-size:15px;color:#cfd6db}
.pn{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);margin-top:36px;padding-top:16px;font-family:var(--display);font-size:14px}
.pn a{text-decoration:none;max-width:48%}
.pn small{display:block;color:var(--muted)}

@media (max-width:860px){
  .stage{grid-template-columns:1fr}
  .mapside{order:-1;top:49px;height:48vh;z-index:10;background:var(--sea);border-bottom:1px solid var(--line)}
  .story{border-right:0;padding-bottom:30vh}
  .step{min-height:46vh}
  .intro{padding:28px 0 12px}
  .intro h1{font-size:32px}
  .legend{display:none}
  .panel{left:12px;right:12px;width:auto}
  .cols{grid-template-columns:1fr}
  .top{padding:10px 16px}
  .top nav a{padding:4px 6px}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#story"><b>Kasaysayan</b><span>Philippine history, island by island</span></a>
  <nav aria-label="Main"><a href="#story" aria-current="page">Story</a><a href="#story">Credits</a><a href="#story">Fact-check rules</a></nav>
</header>
<div class="proto">Prototype v2. Sample events, not fact-checked yet. The hex grid is rough: the real one will use one hex per province.</div>
<div id="app"></div>

<script>
const ERAS={
  precolonial:{n:"Pre-colonial",c:"#8fb860"},
  spanish:{n:"Spanish era",c:"#e0774a"},
  revolution:{n:"Revolution",c:"#e3b04b"},
  american:{n:"American era",c:"#5fa8e0"},
  japanese:{n:"Japanese occupation",c:"#b38bd1"},
  third:{n:"Third Republic",c:"#4fc1a6"},
  martial:{n:"Martial Law",c:"#c9c9c9"},
  edsa:{n:"EDSA",c:"#f2c94c"},
  modern:{n:"Modern",c:"#7c9cf5"}
};
const EV=[
 {id:"tabon",era:"precolonial",yr:"c. 47,000 BP",x:-45000,title:"Tabon Man remains in Palawan",sum:"Human fossils found in the Tabon Caves are among the oldest known in the country.",place:"Quezon, Palawan",lat:9.27,lng:117.97},
 {id:"lci",era:"precolonial",yr:"900",x:900,title:"Laguna Copperplate Inscription",sum:"The oldest known written document from the islands records a cleared debt.",place:"Lumban, Laguna",lat:14.30,lng:121.46},
 {id:"mactan",era:"spanish",yr:"1521",x:1521,title:"Battle of Mactan",sum:"Lapulapu's forces defeat Ferdinand Magellan's landing party on Mactan.",place:"Mactan, Cebu",lat:10.31,lng:123.98},
 {id:"gomburza",era:"spanish",yr:"1872",x:1872,title:"Execution of Gomburza",sum:"Priests Gomez, Burgos and Zamora are executed at Bagumbayan after the Cavite mutiny.",place:"Bagumbayan, Manila",lat:14.58,lng:120.98},
 {id:"pugadlawin",era:"revolution",yr:"1896",x:1896,title:"Cry of Pugad Lawin",sum:"Katipuneros tear their cedulas and start the revolt against Spain.",place:"Quezon City",lat:14.66,lng:121.03,contested:"Sources disagree on the exact date and place. Each version is shown with who supports it."},
 {id:"kawit",era:"revolution",yr:"1898",x:1898,title:"Declaration of Independence",sum:"Emilio Aguinaldo proclaims independence from Spain in Kawit.",place:"Kawit, Cavite",lat:14.44,lng:120.90},
 {id:"commonwealth",era:"american",yr:"1935",x:1935,title:"The Commonwealth begins",sum:"Manuel L. Quezon becomes president of a transitional government under US rule.",place:"Manila",lat:14.59,lng:120.98},
 {id:"bataan",era:"japanese",yr:"1942",x:1942,title:"Fall of Bataan and the Death March",sum:"Filipino and American prisoners are forced to march from Bataan to Tarlac.",place:"Mariveles, Bataan",lat:14.43,lng:120.49,contested:"Death toll estimates differ by source. The range is given with each estimate cited."},
 {id:"leyte",era:"japanese",yr:"1944",x:1944,title:"Leyte Landing",sum:"Allied forces land at Palo, starting the campaign to retake the islands.",place:"Palo, Leyte",lat:11.16,lng:125.01},
 {id:"y1946",era:"third",yr:"1946",x:1946,title:"Independence recognized",sum:"The Treaty of Manila ends American sovereignty over the islands.",place:"Manila",lat:14.58,lng:120.99},
 {id:"pd1081",era:"martial",yr:"1972",x:1972,title:"Proclamation No. 1081",sum:"President Ferdinand Marcos places the whole country under martial law.",place:null,contested:"Dated 21 September, announced 23 September. Both dates are shown with sources."},
 {id:"edsa",era:"edsa",yr:"1986",x:1986,title:"People Power Revolution",sum:"Crowds fill EDSA for four days. Marcos leaves and Corazon Aquino takes office.",place:"EDSA, Quezon City",lat:14.59,lng:121.06,contested:"Crowd size estimates vary widely. Figures are attributed to their sources."},
 {id:"bohol",era:"modern",yr:"2013",x:2013.79,title:"Bohol earthquake",sum:"A magnitude 7.2 earthquake damages towns and centuries-old churches across Bohol.",place:"Sagbayan, Bohol",lat:9.88,lng:124.12},
 {id:"yolanda",era:"modern",yr:"2013",x:2013.85,title:"Typhoon Yolanda",sum:"One of the strongest storms ever recorded strikes Eastern Visayas and Tacloban.",place:"Tacloban, Leyte",lat:11.24,lng:125.00}
];

/* ---------- hex cartogram ---------- */
const K=34,LNG0=116.6,LAT0=19.2,R=10,HW=Math.sqrt(3)*R;
const P=(lng,lat)=>[(lng-LNG0)*K,(LAT0-lat)*K];
const W=(127-LNG0)*K,H=(LAT0-4.8)*K;
const ISL=[
 [[120.6,18.5],[121.2,18.6],[122.2,18.5],[122.4,17],[122.2,16.2],[121.6,15.8],[121.6,14.6],[122,14],[122.6,14.2],[123,13.8],[124,13.2],[124.1,12.6],[123.3,13],[122.6,13.5],[121.8,13.9],[121,13.7],[120.6,14.2],[120.6,14.8],[120,15],[119.8,16.3],[120.4,16.6],[120.4,17.6]],
 [[120.4,13.5],[121.2,13.4],[121.5,12.6],[121.1,12.2],[120.6,12.6]],
 [[121.9,11.9],[122.9,11.6],[123.1,11],[122.5,10.6],[122,10.6]],
 [[122.9,11],[123.5,10.7],[123.2,9.3],[122.6,9.6],[122.4,10.5]],
 [[123.9,11.3],[124.1,10.6],[123.5,9.6],[123.3,9.5],[123.7,10.4]],
 [[123.8,10.1],[124.5,10.1],[124.6,9.7],[124.1,9.6],[123.8,9.8]],
 [[124.3,11.6],[125,11.3],[125.2,10.2],[124.8,10],[124.4,10.8]],
 [[124.3,12.5],[125.4,12.5],[125.7,11.1],[125,11.2],[124.6,11.7]],
 [[119.3,11.4],[119.7,10.9],[118.8,9.8],[117.4,8.4],[117.2,8.5],[118.2,9.8]],
 [[122,8],[123,8.6],[123.8,8.7],[124.4,8.6],[125.2,9.8],[125.6,9.5],[126.2,9.2],[126.6,7.4],[126.2,6.3],[125.4,5.6],[125.2,6.4],[124.2,6.4],[124,7.2],[123.4,7.6],[122.8,7.5],[122.1,6.9],[121.9,7.2]]
].map(p=>p.map(([a,b])=>P(a,b)));
function inside(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
const cellOf=(x,y)=>{const row=Math.round(y/(1.5*R));const col=Math.round((x-(row%2?HW/2:0))/HW);return[row,col];};
const centerOf=(row,col)=>[col*HW+(row%2?HW/2:0),row*1.5*R];
const cells=new Map();
for(let row=0;row*1.5*R<=H;row++)for(let col=0;col*HW<=W;col++){const[x,y]=centerOf(row,col);if(ISL.some(p=>inside(x,y,p)))cells.set(row+","+col,{row,col,x,y,ev:[]});}
EV.forEach((e,i)=>{if(e.lat==null)return;const[x,y]=P(e.lng,e.lat);const[row,col]=cellOf(x,y);const k=row+","+col;
  if(!cells.has(k)){const[cx,cy]=centerOf(row,col);cells.set(k,{row,col,x:cx,y:cy,ev:[]});}
  cells.get(k).ev.push(i);e.cell=k;});
const hexPts=(x,y)=>Array.from({length:6},(_,i)=>{const a=Math.PI/180*(60*i-30);return(x+(R-.6)*Math.cos(a)).toFixed(1)+","+(y+(R-.6)*Math.sin(a)).toFixed(1);}).join(" ");

/* ---------- ruler ---------- */
/* Positions are by event order, not by year: 47,000 years would squash everything else into a dot. */
const ERA_ORDER=Object.keys(ERAS);

function storyView(){
  const bands=ERA_ORDER.map(k=>{const n=EV.filter(e=>e.era===k).length;return n?`<i style="flex:${n};background:${ERAS[k].c}"></i>`:"";}).join("");
  const ticks=[0,2,4,7,10,12,13].map(i=>`<span style="left:${i/(EV.length-1)*100}%">${EV[i].yr.replace("c. ","")}</span>`).join("");
  return `<div class="stage">
  <section class="story" aria-label="Story">
    <div class="intro">
      <h1>Watch the islands fill with history.</h1>
      <p>Scroll, drag the year ruler or press Play. Each event lights up where it happened.</p>
      <div class="hint">↓ Scroll to start</div>
    </div>
    ${EV.map((e,i)=>{const er=ERAS[e.era];return `<article class="step" data-i="${i}" style="--c:${er.c}">
      <div class="era-tag">${er.n}</div>
      <div class="yr ${e.yr.length>6?"long":""}">${e.yr}</div>
      <h2>${e.title}</h2>
      <p>${e.sum}</p>
      <div class="meta"><span>${e.place||"Nationwide"}</span>${e.contested?`<span class="contested">Sources differ</span>`:""}</div>
      <a class="open" href="#e-${e.id}">Read the full story →</a>
    </article>`}).join("")}
  </section>
  <aside class="mapside" aria-label="Map of the Philippines">
    <div class="mapwrap" id="mapwrap">
      <div class="legend" id="legend"></div>
      <div class="panel" id="panel" role="dialog" aria-label="Events in this place"></div>
      <svg id="hexmap" viewBox="-12 -12 ${W+24} ${H+24}" role="img" aria-label="Hexagon map of the Philippines">
        <g id="hexes">${[...cells.entries()].map(([k,c])=>`<polygon class="hx${c.ev.length?" ev":""}" data-k="${k}" points="${hexPts(c.x,c.y)}" ${c.ev.length?`tabindex="0" role="button" aria-label="${EV[c.ev[0]].place}: ${c.ev.length} event${c.ev.length>1?"s":""}"`:""}/>`).join("")}</g>
        <g id="fx"></g>
      </svg>
    </div>
    <div class="ruler">
      <button class="play" id="play" aria-pressed="false">▶ Play</button>
      <div class="track">
        <div class="bands">${bands}</div>
        <input type="range" id="scrub" min="0" max="${EV.length-1}" value="0" step="1" aria-label="Move through events">
        <div class="ticks">${ticks}</div>
      </div>
    </div>
  </aside>
  </div>`;
}

let cur=-1,timer=null,obs=null;
function setCurrent(i){
  if(i===cur)return;cur=i;
  const e=EV[i],er=ERAS[e.era];
  document.querySelectorAll(".step").forEach(s=>s.classList.toggle("on",+s.dataset.i===i));
  document.querySelectorAll(".hx").forEach(h=>{h.classList.remove("past","now");h.style.fill="";});
  EV.forEach((x,j)=>{if(j<=i&&x.cell){const h=document.querySelector(`.hx[data-k="${x.cell}"]`);h.style.fill=ERAS[x.era].c;h.classList.add(j===i?"now":"past");}});
  const svg=document.getElementById("hexmap");svg.classList.toggle("nationwide",!e.cell);svg.style.setProperty("--nc",er.c);
  const fx=document.getElementById("fx");
  if(e.cell){const c=cells.get(e.cell);const right=c.x>W*.6;
    fx.innerHTML=`<circle class="ring" cx="${c.x}" cy="${c.y}" r="${R}"/><text class="lbl" x="${right?c.x-R-6:c.x+R+6}" y="${c.y+4}" text-anchor="${right?"end":"start"}">${e.place}</text>`;}
  else fx.innerHTML=`<text class="lbl" x="${W/2}" y="${H-10}" text-anchor="middle">Nationwide</text>`;
  document.getElementById("legend").innerHTML=`<div class="now-card" style="--c:${er.c}"><small>${er.n}</small>${e.yr} · ${e.place||"Nationwide"}</div><div>Lit hexes = places history has reached so far.</div>`;
  const s=document.getElementById("scrub");if(s)s.value=i;
}
function goTo(i){const s=document.querySelector(`.step[data-i="${i}"]`);if(s)s.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});setCurrent(i);}
function stopPlay(){clearInterval(timer);timer=null;const b=document.getElementById("play");if(b){b.textContent="▶ Play";b.setAttribute("aria-pressed","false");}}
function openPanel(k){
  const c=cells.get(k),p=document.getElementById("panel");
  p.innerHTML=`<button class="x" aria-label="Close">✕</button><h3>${EV[c.ev[0]].place}</h3><ul>${c.ev.map(i=>`<li><a href="#e-${EV[i].id}">${EV[i].yr} · ${EV[i].title}</a></li>`).join("")}</ul>`;
  p.classList.add("show");p.querySelector(".x").onclick=()=>p.classList.remove("show");
}
function wireStory(){
  cur=-1;setCurrent(0);
  if(obs)obs.disconnect();
  obs=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting&&!timer)setCurrent(+en.target.dataset.i);}),{rootMargin:"-45% 0px -45% 0px"});
  document.querySelectorAll(".step").forEach(s=>obs.observe(s));
  document.getElementById("scrub").oninput=ev=>{stopPlay();goTo(+ev.target.value);};
  document.getElementById("play").onclick=ev=>{
    if(timer){stopPlay();return;}
    const b=ev.currentTarget;b.textContent="❚❚ Pause";b.setAttribute("aria-pressed","true");
    if(cur>=EV.length-1)goTo(0);
    timer=setInterval(()=>{if(cur>=EV.length-1){stopPlay();return;}goTo(cur+1);},2200);
  };
  document.querySelectorAll(".hx.ev").forEach(h=>{h.onclick=()=>openPanel(h.dataset.k);h.onkeydown=ev=>{if(ev.key==="Enter")openPanel(h.dataset.k);};});
}

function eventView(id){
  const i=EV.findIndex(e=>e.id===id),e=EV[i],er=ERAS[e.era],pv=EV[i-1],nx=EV[i+1];
  return `<article class="event" style="--c:${er.c}">
    <a class="back" href="#story">← Back to the map</a>
    <div class="yr">${e.yr}</div>
    <div class="era-tag" style="--c:${er.c}">${er.n}</div>
    <h1>${e.title}</h1>
    <figure class="photo"><div class="img">Historical photo goes here</div><figcaption>Photo: author, year. Public domain, via Wikimedia Commons.</figcaption></figure>
    ${e.contested?`<div class="note"><b>Sources differ.</b> ${e.contested}</div>`:""}
    <div class="cols">
      <div class="body"><p>${e.sum} The full story goes here: 150 to 250 words written from the sources below, with each name, date and number tied to a numbered source.<sup>[1]</sup></p><p>Where historians disagree, the story says so and names who says what.<sup>[2]</sup></p></div>
      <div>${e.lat!=null?`<div class="leaflet"><div class="fake"><i></i></div><small>Real map here: Leaflet + OpenStreetMap, pinned at ${e.place}</small></div>`:`<div class="note">Nationwide event, so there is no pin.</div>`}</div>
    </div>
    <section class="sources"><h2>Sources</h2><ol><li>National Historical Commission of the Philippines (link added during research)</li><li>Official Gazette of the Republic of the Philippines (link added during research)</li></ol></section>
    <nav class="pn">${pv?`<a href="#e-${pv.id}"><small>← Earlier</small>${pv.title}</a>`:"<span></span>"}${nx?`<a href="#e-${nx.id}" style="text-align:right"><small>Later →</small>${nx.title}</a>`:"<span></span>"}</nav>
  </article>`;
}

let lastStep=0;
function route(){
  const h=location.hash.slice(1);const app=document.getElementById("app");stopPlay();
  const e=h.startsWith("e-")&&EV.find(x=>x.id===h.slice(2));
  if(e){if(cur>=0)lastStep=cur;app.innerHTML=eventView(e.id);window.scrollTo(0,0);}
  else{app.innerHTML=storyView();wireStory();if(lastStep)goTo(lastStep);}
}
addEventListener("hashchange",route);
route();
</script>
</body>
</html>
