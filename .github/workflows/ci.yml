name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Check event content
        run: npm run check
      - name: Lint
        run: npx eslint app components lib scripts
      - name: Type check
        run: npx tsc --noEmit
      - name: Static build
        run: npm run build
